spring.application.name=CPUTradeBackend
server.port=8080

# --- MySQL (local dev) ---
# Create this schema/user first (see backend/README.md), then adjust the
# password below to whatever you actually set.
spring.datasource.url=jdbc:mysql://localhost:3306/cputrade?useSSL=false&serverTimezone=UTC
spring.datasource.username=cputrade_app
spring.datasource.password=ChangeMe_StrongPass!

# Fast-iteration schema management for this build pass (single dev, no
# deployed environments yet). Switch to Flyway/Liquibase before a second
# developer or a real deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Dev-only secret. Override with a real secret (env var JWT_SECRET) before
# this ever runs anywhere but localhost.
jwt.secret=${JWT_SECRET:cputrade-dev-secret-change-me-before-any-real-deployment-01234567}
# 24-hour expiry (US1.4), in milliseconds.
jwt.expiration-ms=86400000

# --- CORS ---
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
