spring.application.name=CPUTradeBackend
# Most hosting platforms (Render, Railway, Heroku, ...) inject their own PORT
# env var and expect the app to bind to it.
server.port=${PORT:8080}

# --- MySQL ---
# Create this schema/user first (see backend/README.md). All three are
# overridable via env vars (DB_URL/DB_USERNAME/DB_PASSWORD) so the literal
# local-dev password below never has to be the one used anywhere it matters —
# see DEPLOYMENT.md for what to set it to outside localhost.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cputrade?useSSL=false&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${DB_USERNAME:cputrade_app}
spring.datasource.password=${DB_PASSWORD:ChangeMe_StrongPass!}

# Fast-iteration schema management for this build pass (single dev, no
# deployed environments yet). Switch to Flyway/Liquibase before a second
# developer or a real deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Dev-only secret. Override with a real secret (env var JWT_SECRET) before
# this ever runs anywhere but localhost.
jwt.secret=${JWT_SECRET:cputrade-dev-secret-change-me-before-any-real-deployment-01234567}
# 24-hour expiry (US1.4), in milliseconds.
jwt.expiration-ms=86400000

# --- CORS ---
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# --- File storage ---
# Product photos are written here as real files (see ImageStorageService)
# instead of as Base64 text in the database, and served back at /uploads/**.
# On an ephemeral-filesystem host, point this at a mounted persistent volume
# — or swap ImageStorageService for a real object-store client — since local
# files won't survive a redeploy there.
app.upload-dir=${UPLOAD_DIR:./uploads}
