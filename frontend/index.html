<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="The CPUT student marketplace — buy, sell and swap with fellow students." />
    <title>CPUTrade</title>

    <!-- vite-plugin-pwa injects the manifest link + service worker
         registration automatically. The tags below cover the platforms that
         don't read a web manifest for this: iOS/iPadOS Safari (pre-16.4) and
         Windows tiles both need their own dedicated meta tags/icon files. -->
    <meta name="theme-color" content="#16305c" />

    <!-- iOS/iPadOS: makes "Add to Home Screen" launch full-screen instead of
         opening inside Safari's chrome, and sets the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CPUTrade" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Windows: pin-to-Start-Menu tile color/icon. -->
    <meta name="msapplication-TileColor" content="#16305c" />
    <meta name="msapplication-TileImage" content="/icons/mstile-150.png" />

    <!-- Boot splash: plain HTML/CSS in <head> so it paints before the Vue
         bundle even finishes evaluating, instead of a blank white flash.
         Removed by main.js once the app has actually mounted. Background
         matches the PWA manifest's background_color so there's no visible
         handoff from the OS-drawn splash (installed launch) to this one. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f7fa;
        transition: opacity 0.35s ease;
      }
      #app-splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash svg {
        width: 88px;
        height: 88px;
      }
      #app-splash .splash-word {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 26px;
        color: #16305c;
        letter-spacing: -0.01em;
      }
      #app-splash .splash-tag {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #0d9488;
      }
      #app-splash .splash-dots {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      #app-splash .splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #0d9488;
        opacity: 0.3;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      #app-splash .splash-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #app-splash .splash-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes splash-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="180" height="180" rx="44" fill="#16305c" />
        <path d="M50,74 Q95,60 138,74" stroke="#0d9488" stroke-width="16" stroke-linecap="round" fill="none" />
        <g transform="translate(138,74) rotate(18.03)"><polygon points="18,0 -18,-16 -18,16" fill="#0d9488" /></g>
        <path d="M150,126 Q105,140 62,126" stroke="#0d9488" stroke-width="16" stroke-linecap="round" fill="none" />
        <g transform="translate(62,126) rotate(198.03)"><polygon points="18,0 -18,-16 -18,16" fill="#0d9488" /></g>
      </svg>
      <div class="splash-word">CPUTrade</div>
      <div class="splash-tag">Buy Less · Trade Smart</div>
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
